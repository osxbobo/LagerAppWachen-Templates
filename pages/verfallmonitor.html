<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F26B2E">
  <title>Verfallmonitor – LAGER//APP</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/mitarbeiter.css">
  <link rel="stylesheet" href="../css/verfallmonitor.css">
</head>
<body>

  <header class="m-nav">
    <button class="m-back" title="Lagersuche">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l-5 5 5 5"/></svg>
    </button>
    <span class="la-wordmark">LAGER<span class="slash">//</span>APP</span>
    <button class="wache-pill hidden" id="wache-pill"></button>
    <div class="m-nav-right">
      <button id="wl-nav-btn" class="m-panel-btn">
        <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3"/><path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M14 9v4M16 11h-4"/></svg>
        Wachenleiter
      </button>
      <a id="panel-back-btn" class="m-panel-btn" href="portal.html">
        <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="16" height="13" rx="2"/><path d="M6 7h8M6 10h5"/></svg>
        Panel
      </a>
      <button class="m-theme" id="theme-btn">☀️</button>
    </div>
  </header>

  <!-- Page -->
  <div class="vm-page">

    <!-- Header -->
    <div class="vm-header">

      <!-- Title -->
      <div class="vm-title">
        Verfälle<span class="vm-month-label" id="page-month-label"> · Mai 26</span>
      </div>

      <!-- KPI counter cards -->
      <div class="vm-kpi-grid">
        <div class="vm-kpi-card vm-kpi-card--crit">
          <div class="la-stat">
            <span class="lbl">Akut</span>
            <span class="val" id="kpi-ueberfaellig">–</span>
          </div>
        </div>
        <div class="vm-kpi-card vm-kpi-card--low">
          <div class="la-stat">
            <span class="lbl">≤30 T</span>
            <span class="val" id="kpi-diesen-monat">–</span>
          </div>
        </div>
        <div class="vm-kpi-card vm-kpi-card--neutral">
          <div class="la-stat">
            <span class="lbl">Folge</span>
            <span class="val" id="kpi-folge">–</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Body -->
    <div class="vm-body">

      <!-- Heatmap -->
      <div class="vm-section-label">
        Verfallskalender — 6 Monate
      </div>
      <div class="vm-heatmap-card" id="heatmap-card">
        <!-- rendered by JS -->
      </div>

      <!-- Dynamic groups -->
      <div id="content" class="vm-content">
        <div class="vm-loading">
          <div class="vm-spinner"></div>
          <span class="vm-loading-text">Verbinde mit Firebase…</span>
        </div>
      </div>

    </div>
  </div>

  <!-- FAB -->
  <a href="./scanner.html" class="vm-fab">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5V3h2M13 5V3h2M3 11V9M3 19v-2M3 14H1M21 14h-2M5 3H3v2M21 3h-2v2M21 9V7M21 19v-2M19 21h2v-2M3 21h2v-2M14 21h-2v-2"/></svg>
    Charge scannen
  </a>

  <script type="module" src="../js/verfallmonitor.js"></script>
  <script src="../js/pwa.js"></script>
  <script>
    (function() {
      const L = {}; // Wachen-Labels hier eintragen (z. B. w1_meinstadt:'W1 Meine Stadt')
      const w = localStorage.getItem('activeWache');
      const p = document.getElementById('wache-pill');
      const city = w && L[w] ? L[w].split(' ').slice(1).join(' ') : '';
      if (p && city) { p.textContent = city; p.classList.remove('hidden'); p.onclick = function(){ localStorage.removeItem('activeWache'); location.href='../index.html'; }; }
    })();
  </script>
</body>
</html>
